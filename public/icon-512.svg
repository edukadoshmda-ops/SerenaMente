<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b0764" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo com Cantos Super Arredondados Modernos -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" />

  <!-- Efeito de Luz Suave Interno -->
  <circle cx="160" cy="140" r="120" fill="#ffffff" opacity="0.12" />

  <!-- Ícone Coração Acolhedor com Fones de Ouvido (Playbook & Cuidado) -->
  <g filter="url(#softGlow)">
    <!-- Coração Central -->
    <path d="M256 410c-8 0-16-3-22-9-75-71-134-127-134-197 0-53 41-94 94-94 34 0 66 17 84 44 18-27 50-44 84-44 53 0 94 41 94 94 0 70-59 126-134 197-6 6-14 9-22 9z" fill="url(#heartGrad)" />
    
    <!-- Fone de Ouvido Estilizado envolvendo o coração -->
    <!-- Arco do Fone -->
    <path d="M140 230 A 120 120 0 0 1 372 230" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.95" />
    
    <!-- Almofada do Fone Esquerda -->
    <rect x="122" y="210" width="28" height="56" rx="14" fill="#ffffff" />
    <!-- Almofada do Fone Direita -->
    <rect x="362" y="210" width="28" height="56" rx="14" fill="#ffffff" />
  </g>

  <!-- Brilho Mágico / Centelha de Esperança -->
  <path d="M256 160 L262 178 L280 184 L262 190 L256 208 L250 190 L232 184 L250 178 Z" fill="#fbbf24" opacity="0.9" />
</svg>
